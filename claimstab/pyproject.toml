[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimstab"
version = "0.3.0"
description = "Generate claim stability matrices from cross-pipeline endpoint results"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "The authors of the associated manuscript"}]
dependencies = []

[project.scripts]
claimstab = "claimstab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
